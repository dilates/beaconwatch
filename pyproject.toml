[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beaconwatch"
version = "1.0.0"
description = "Passive C2 beaconing detector for Linux — catches regular check-in patterns via timing analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "dilates", email = "dilateig@gmail.com" }]
keywords = ["security", "c2", "beacon", "network", "detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "pyroute2>=0.7",
    "numpy>=1.24",
    "textual>=0.47",
    "rich>=13.0",
    "tomllib; python_version < '3.11'",
    "httpx>=0.25",
    "notify2>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
beaconwatch = "beaconwatch.cli:main"

[project.urls]
Homepage = "https://github.com/dilates"
Repository = "https://github.com/dilates/beaconwatch"

[tool.hatch.build.targets.wheel]
packages = ["beaconwatch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
